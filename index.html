<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prime Pop</title>
  <style>
    :root{--ink:#202124;--paper:#fbf7ee;--mint:#2bb7a8;--coral:#ff6f61;--sun:#f6b73c;--plum:#7446a8;--sky:#3d8eea;--shadow:rgba(49,35,14,.22);font-family:"Arial Rounded MT Bold","Yu Gothic",system-ui,sans-serif}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 18% 18%,rgba(61,142,234,.16) 0 16%,transparent 17%),linear-gradient(135deg,transparent 0 46%,rgba(255,111,97,.14) 46.2% 55%,transparent 55.2%),linear-gradient(26deg,#fbf7ee 0 62%,#eee6d8 62.2%);overflow:hidden;user-select:none}button{border:0;color:inherit;font:inherit;cursor:pointer;touch-action:manipulation}
    .app{width:min(100vw,520px);height:100svh;min-height:620px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;position:relative}.topbar{padding:14px 16px 5px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px}.stat{display:grid;gap:2px;font-weight:950;line-height:1}.stat small{font-size:13px;letter-spacing:.08em}.stat strong{font-size:32px}.progress{text-align:center;font-size:38px;font-weight:950;letter-spacing:.06em;line-height:1}.pause{justify-self:end;width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:rgba(255,255,255,.55);font-size:20px;font-weight:950;display:grid;place-items:center}
    .stage{position:relative;display:grid;align-items:center;padding:0 18px 8px;perspective:900px}.arena{width:92%;height:min(50svh,460px);min-height:330px;margin:0 auto;position:relative;display:grid;place-items:center}.gate{width:76%;max-width:350px;height:82%;position:relative;display:grid;place-items:center;color:white;background:linear-gradient(100deg,rgba(255,255,255,.20),transparent 22%),linear-gradient(155deg,#2f245f 0 44%,#16142e 44.5% 100%);border:6px solid #171326;border-radius:22px 22px 11px 11px;box-shadow:18px 18px 0 #20193a,0 26px 0 rgba(49,35,14,.16);transform:rotateY(-10deg) rotateZ(-3deg);transition:filter .16s ease;overflow:hidden}.gate:before{content:"";position:absolute;inset:12px;border-radius:16px 16px 8px 8px;border:3px dashed rgba(255,255,255,.2)}.gate:after{content:"";position:absolute;left:-22%;top:-15%;width:45%;height:150%;background:rgba(255,255,255,.11);transform:rotate(12deg)}.number{position:relative;z-index:2;font-size:clamp(78px,28vw,168px);font-weight:950;line-height:1;text-shadow:0 5px 0 rgba(0,0,0,.18)}
    .gate.hit{animation:hit .21s ease}.gate.wrong{animation:wrong .23s ease}.gate.break{animation:burst .5s ease forwards}.chip{position:absolute;left:4%;bottom:28%;width:48px;height:48px;border-radius:50%;color:white;background:var(--sky);display:grid;place-items:center;font-size:24px;font-weight:950;opacity:0;box-shadow:0 6px 0 #2063a5;pointer-events:none;z-index:3}.chip.fly{animation:fly .27s ease-out}.spark{position:absolute;inset:20% 12%;pointer-events:none;opacity:0;background:radial-gradient(circle at 42% 42%,white 0 3px,transparent 4px),radial-gradient(circle at 64% 38%,#ffe28a 0 4px,transparent 5px),radial-gradient(circle at 55% 62%,white 0 3px,transparent 4px),linear-gradient(110deg,transparent 0 45%,white 45.5% 46.5%,transparent 47%);mix-blend-mode:screen}.spark.show{animation:spark .43s ease}
    .chain{position:absolute;left:0;right:0;bottom:0;min-height:54px;padding:8px 16px;color:white;background:rgba(32,33,36,.72);display:grid;place-items:center;font-size:28px;font-weight:950;letter-spacing:.02em}.chain.empty{color:rgba(255,255,255,.68);font-size:18px}.controls{padding:0 12px 14px;display:grid;gap:10px}.prime-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.prime-btn{aspect-ratio:1;min-width:0;border-radius:18px;color:white;background:var(--mint);box-shadow:0 7px 0 #168578,0 12px 18px var(--shadow);font-size:clamp(31px,10vw,50px);font-weight:950;transition:transform .08s ease,filter .12s ease,background .12s ease}.prime-btn:nth-child(2n){background:var(--sky);box-shadow:0 7px 0 #2165aa,0 12px 18px var(--shadow)}.prime-btn:nth-child(3n){background:var(--sun);box-shadow:0 7px 0 #b97910,0 12px 18px var(--shadow)}.prime-btn:nth-child(4n){background:var(--coral);box-shadow:0 7px 0 #ba4238,0 12px 18px var(--shadow)}.prime-btn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.22)}.prime-btn.flash-good{filter:brightness(1.35)}.prime-btn.flash-bad{background:#3b3b3b;box-shadow:0 7px 0 #151515,0 12px 18px var(--shadow)}
    .mode-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode-label{min-height:46px;border-radius:8px;background:rgba(32,33,36,.82);color:white;display:grid;place-items:center;font-size:18px;font-weight:950;letter-spacing:.04em}.mode-btn,.run-btn{min-height:46px;border-radius:8px;background:#e5dccd;font-size:16px;font-weight:950;box-shadow:inset 0 -2px 0 rgba(0,0,0,.09)}.mode-btn.active{color:white;background:var(--plum)}.run-btn{color:white;background:var(--ink)}.home-choice{position:relative;min-height:96px;border-radius:12px;border:6px solid transparent;color:white;font-size:clamp(24px,7vw,36px);font-weight:950;opacity:.28;filter:grayscale(.55) saturate(.35);box-shadow:0 4px 0 rgba(0,0,0,.18),0 10px 18px rgba(49,35,14,.16);transition:transform .12s ease,opacity .12s ease,filter .12s ease,border-color .12s ease}.home-choice.selected{opacity:1;filter:saturate(1.15);transform:translateY(-5px);border-color:#202124;box-shadow:0 10px 0 rgba(0,0,0,.30),0 18px 28px rgba(49,35,14,.30)}.home-choice.selected:after{content:"✓";position:absolute;right:14px;top:10px;width:34px;height:34px;border-radius:50%;background:white;color:#202124;display:grid;place-items:center;font-size:24px;font-weight:950}.home-choice.normal{background:var(--plum)}.home-choice.challenge{background:var(--coral)}#homeStartBtn{min-height:104px;font-size:clamp(30px,10vw,52px);border-radius:14px;box-shadow:0 10px 0 rgba(0,0,0,.26),0 18px 28px rgba(49,35,14,.24)}.mistake-screen{position:absolute;inset:0;z-index:9;display:grid;place-items:center;align-content:center;gap:10px;color:rgba(255,255,255,.96);background:rgba(210,44,44,.82);font-weight:950;line-height:1;opacity:0;pointer-events:none;transform:scale(.82);transition:opacity .12s ease,transform .12s ease}.mistake-screen.show{opacity:1;transform:scale(1)}.mistake-x{font-size:min(50vw,210px)}.mistake-answer{max-width:92%;font-size:clamp(42px,13vw,86px);text-align:center;line-height:1.08;text-shadow:0 4px 0 rgba(0,0,0,.18);word-break:keep-all}.overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:rgba(251,247,238,.94)}.card{width:min(100%,420px);border-radius:8px;background:white;padding:20px;display:grid;gap:18px;box-shadow:0 18px 50px rgba(49,35,14,.24)}.card h1{margin:0;font-size:34px;line-height:1}.card p{margin:0;line-height:1.7;font-weight:800}.clear-date{margin:0;border-radius:8px;background:#202124;color:white;padding:12px;text-align:center;font-weight:950}.card-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.result-num{padding:12px 8px;border-radius:8px;background:#f1eadf;text-align:center;display:grid;gap:4px}.result-num small{font-size:12px;font-weight:900;color:#665d50}.result-num strong{font-size:31px;line-height:1}.hidden{display:none}
    @keyframes hit{0%{transform:rotateY(-10deg) rotateZ(-3deg) translateX(0)}50%{transform:rotateY(-10deg) rotateZ(-3deg) translateX(9px) scale(.99);filter:brightness(1.25)}100%{transform:rotateY(-10deg) rotateZ(-3deg) translateX(0)}}@keyframes wrong{0%,100%{transform:rotateY(-10deg) rotateZ(-3deg) translateX(0)}25%{transform:rotateY(-10deg) rotateZ(-3deg) translateX(-9px)}75%{transform:rotateY(-10deg) rotateZ(-3deg) translateX(9px)}}@keyframes burst{0%{transform:rotateY(-10deg) rotateZ(-3deg) scale(1);opacity:1}62%{transform:rotateY(-10deg) rotateZ(-3deg) scale(1.1);opacity:.32}100%{transform:rotateY(-10deg) rotateZ(-3deg) scale(.84);opacity:0}}@keyframes fly{0%{transform:translate(0,0) scale(.65) rotate(-18deg);opacity:0}20%{opacity:1}100%{transform:translate(230px,-132px) scale(.42) rotate(28deg);opacity:0}}@keyframes spark{0%{opacity:0;transform:scale(.75)}35%{opacity:1}100%{opacity:0;transform:scale(1.18)}}@media(max-height:720px){.topbar{padding-top:8px}.arena{height:44svh;min-height:280px}.prime-pad{gap:7px}.controls{gap:7px;padding-bottom:8px}.chain{min-height:46px;font-size:24px}}
  </style>
  <style>
    /* Home screen: selection is shown only with a clear black frame. */
    .home-choice.selected::after{content:none!important;display:none!important}
    .home-choice{border-color:rgba(32,33,36,.28);opacity:.32;filter:grayscale(.65) saturate(.35)}
    .home-choice.selected{opacity:1;filter:none;transform:translateY(-7px);border-color:#202124;outline:6px solid #202124;outline-offset:2px;box-shadow:0 12px 0 rgba(0,0,0,.36),0 20px 30px rgba(49,35,14,.34)}
    .home-rule{margin:0;padding:11px 10px;border:3px solid #e73331;border-radius:999px;color:#b91f23;background:#fff7f5;text-align:center;font-size:clamp(15px,4.4vw,19px);font-weight:950;line-height:1.25;box-shadow:0 4px 0 rgba(185,31,35,.20)}
    .clear-card{position:relative;isolation:isolate;overflow:hidden;padding:24px 20px 20px;background:linear-gradient(145deg,#fffdf8 0 47%,#fff0c8 47.5% 100%);border:5px solid #202124;box-shadow:0 12px 0 #202124,0 25px 55px rgba(49,35,14,.34)}.clear-card:before{content:"";position:absolute;z-index:-1;inset:-55%;background:repeating-conic-gradient(from 0deg,rgba(246,183,60,.23) 0 9deg,transparent 9deg 20deg);animation:spin-rays 18s linear infinite}.clear-kicker{letter-spacing:.18em;font-size:12px;font-weight:950;color:#6b4a12}.clear-title{margin:0!important;font-size:clamp(64px,20vw,92px)!important;line-height:.86!important;letter-spacing:-.07em;color:#ff6f61;text-align:center;text-shadow:0 5px 0 #8f3129,0 9px 0 rgba(32,33,36,.14);animation:clear-pop .6s cubic-bezier(.2,1.5,.4,1) both}.clear-title.fail-title{font-size:clamp(38px,12vw,56px)!important;line-height:1.05!important;letter-spacing:0!important}.goal-badge{justify-self:center;margin:2px 0 5px;padding:7px 16px;border-radius:999px;color:white;background:#202124;font-weight:950;letter-spacing:.08em;box-shadow:0 4px 0 #6b4a12}.clear-message{position:relative;margin:0!important;text-align:center;font-size:21px;font-weight:950!important;letter-spacing:.08em}.clear-card .card-grid{position:relative}.clear-card .result-num{background:rgba(255,255,255,.88);border:2px solid rgba(32,33,36,.16);box-shadow:0 4px 0 rgba(32,33,36,.17)}.clear-card .result-num strong{font-size:clamp(22px,7vw,31px)}.clear-card .clear-date{position:relative;border:2px solid #202124;background:#202124;box-shadow:0 4px 0 #6b4a12}.confetti{position:absolute;z-index:-1;inset:0;overflow:hidden;pointer-events:none}.confetti i{position:absolute;top:-10%;left:var(--x);width:10px;height:18px;background:var(--c);border-radius:2px;transform:rotate(var(--r));animation:confetti-fall 2.1s cubic-bezier(.1,.75,.35,1) var(--d) both}.confetti i:nth-child(3n){width:16px;height:8px;border-radius:999px}.confetti i:nth-child(4n){background:#3d8eea}.confetti i:nth-child(5n){background:#2bb7a8}@keyframes clear-pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}75%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}@keyframes confetti-fall{0%{transform:translateY(-10px) rotate(var(--r));opacity:0}8%{opacity:1}100%{transform:translateY(510px) rotate(calc(var(--r) + 460deg));opacity:0}}@keyframes spin-rays{to{transform:rotate(1turn)}}
    .hanamaru{position:relative;width:62px;height:62px;margin:-2px auto -7px;animation:hanamaru-pop .7s .12s cubic-bezier(.2,1.5,.4,1) both}.hanamaru i{position:absolute;left:50%;top:50%;width:15px;height:33px;background:#e73331;border-radius:60% 60% 54% 54%;box-shadow:0 2px 0 #a91318;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(var(--a))}.hanamaru:after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;border-radius:50%;background:#e73331;box-shadow:0 2px 0 #a91318;transform:translate(-50%,-50%)}@keyframes hanamaru-pop{0%{transform:scale(0) rotate(-35deg);opacity:0}75%{transform:scale(1.18) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
  </style>
</head>
<body>
  <main class="app" aria-label="Prime Pop">
    <section class="topbar"><div class="stat"><small>TIME</small><strong id="time">0.0 sec.</strong><small id="popLabel">00 pops</small><small id="missLabel">MISS 0/1</small></div><div class="progress" id="progress">00/20</div><button class="pause" id="pauseBtn" aria-label="pause">II</button></section>
    <section class="stage"><div class="arena"><div class="chip" id="chip">2</div><div class="gate" id="gate"><div class="number" id="number">56</div></div><div class="spark" id="spark"></div></div><div class="chain empty" id="chain">prime chips</div></section>
    <section class="controls"><div class="prime-pad" id="pad"></div><div class="mode-label" id="modeLabel">MODE: &#12405;&#12388;&#12358;</div><button class="run-btn" id="startBtn">START</button></section>
    <div class="mistake-screen" id="mistakeScreen"><div class="mistake-x">&#215;</div><div class="mistake-answer" id="mistakeAnswer"></div></div>
    <section class="overlay" id="overlay"><div class="card"><p class="home-rule">30&#21839;&#12539;150&#31186;&#20197;&#20869;&#12289;&#12511;&#12473;1&#21839;&#20197;&#20869;&#12391;500&#20870;&#21048;&#65281;</p><button class="home-choice normal selected" data-home-mode="normal">&#12405;&#12388;&#12358;</button><button class="home-choice challenge" data-home-mode="challenge">&#12385;&#12419;&#12428;&#12435;&#12376;</button><button class="run-btn" id="homeStartBtn">START</button></div></section>
  </main>
  <script>
    const TXT={normal:"\u3075\u3064\u3046",challenge:"\u30c1\u30e3\u30ec\u30f3\u30b8",again:"\u3082\u3046\u4e00\u56de",done:"\u304a\u3057\u307e\u3044",opened:"\u3042\u3051\u305f",one:"\u30ef\u30f3\u30d1\u30f3",miss:"\u30df\u30b9",result:"\u6b21\u306f\u3061\u304c\u3046\u6570\u5b57\u304c\u51fa\u307e\u3059\u3002",divide:"\u3067\u308f\u308b"};
    const MODES={normal:{label:TXT.normal,primes:[2,3,5,7,11],max:200,filter:()=>true},challenge:{label:TXT.challenge,primes:[2,3,5,7,11,13,17,19],max:999,filter:f=>!f.some(n=>n>=13)||f.length<=3}};
    const DISPLAY_DELAY=1300,FAVORITES=[42,48,54,56,63,64,72,81,84,96,99,108,121,132,144,154,168,176,180,198];
    const TIMES_TABLE=[21,24,25,27,28,30,32,35,36,40,42,45,48,49,54,56,63,64,72,81];
    const els={time:document.getElementById("time"),popLabel:document.getElementById("popLabel"),missLabel:document.getElementById("missLabel"),progress:document.getElementById("progress"),pad:document.getElementById("pad"),gate:document.getElementById("gate"),number:document.getElementById("number"),chain:document.getElementById("chain"),chip:document.getElementById("chip"),spark:document.getElementById("spark"),mistakeScreen:document.getElementById("mistakeScreen"),mistakeAnswer:document.getElementById("mistakeAnswer"),modeLabel:document.getElementById("modeLabel"),startBtn:document.getElementById("startBtn"),homeStartBtn:document.getElementById("homeStartBtn"),overlay:document.getElementById("overlay"),pauseBtn:document.getElementById("pauseBtn")};
    let modeName="normal",bank=[],usedNumbers=new Set(),remaining=1,original=1,currentFactors=[],inputChain=[],pops=0,onePunches=0,misses=0,running=false,paused=false,startedAt=0,elapsedBeforePause=0,tickTimer=null,revealTimer=null,audioContext=null;
    function factorsOf(value,primes){const factors=[];let n=value;for(const p of primes){while(n%p===0){factors.push(p);n/=p}}return n===1?factors:null}
    function buildBank(mode){const items=[];for(let n=2;n<=mode.max;n++){const factors=factorsOf(n,mode.primes);if(factors&&factors.length>1&&mode.filter(factors))items.push({n,factors})}return items}
    function weightOf(item){const fivePenalty=item.factors.includes(5)?.42:1;return((FAVORITES.includes(item.n)?4:1)+Math.min(item.factors.length,5)*.4)*fivePenalty}
    function weightedPick(items){let needle=Math.random()*items.reduce((s,i)=>s+weightOf(i),0);for(const item of items){needle-=weightOf(item);if(needle<=0)return item}return items[items.length-1]}
    function targetCount(){const base=modeName==="normal"?30:20;return base+Math.floor(misses/3)*2}
    function candidatesForNextPop(){const q=pops+1,firstHalf=q<=Math.ceil(targetCount()/2),allowEleven=q>=8;let items=bank.filter(item=>{if(item.n<=20)return false;if(usedNumbers.has(item.n))return false;if(!allowEleven&&item.factors.includes(11))return false;if(modeName==="normal"){if(q<=15)return TIMES_TABLE.includes(item.n);return item.n<=99}if(firstHalf)return item.n<=99;return item.n>=100});if(!items.length)items=bank.filter(item=>item.n>20&&!usedNumbers.has(item.n)&&(allowEleven||!item.factors.includes(11))&&(modeName!=="normal"||item.n<=99));if(!items.length){usedNumbers.clear();items=bank.filter(item=>item.n>20&&(allowEleven||!item.factors.includes(11))&&(modeName!=="normal"||item.n<=99))}return items.length?items:bank}
    function ensureAudio(){if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==="suspended")audioContext.resume()}
    function tone(freq,duration,type,gainValue){ensureAudio();const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(gainValue,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);osc.connect(gain);gain.connect(audioContext.destination);osc.start();osc.stop(audioContext.currentTime+duration)}
    function sound(kind){if(kind==="good")tone(560,.075,"sine",.08);if(kind==="bad")tone(112,.13,"square",.065);if(kind==="pop"){tone(260,.08,"triangle",.08);setTimeout(()=>tone(720,.12,"sine",.08),70)}}
    function setMode(nextMode){modeName=nextMode;bank=buildBank(MODES[modeName]);document.querySelectorAll("[data-home-mode]").forEach(b=>b.classList.toggle("selected",b.dataset.homeMode===modeName));els.modeLabel.textContent=modeName==="normal"?"MODE: \u3075\u3064\u3046":"MODE: \u3061\u3083\u308c\u3093\u3058";renderPad();nextPop();updateHeader()}
    function renderPad(){els.pad.innerHTML="";MODES[modeName].primes.forEach(prime=>{const button=document.createElement("button");button.className="prime-btn";button.textContent=prime;button.setAttribute("aria-label",`${prime}${TXT.divide}`);button.addEventListener("click",()=>pressPrime(prime,button));els.pad.appendChild(button)})}
    function elapsedMs(){return running&&!paused?elapsedBeforePause+performance.now()-startedAt:elapsedBeforePause}
    function formatElapsed(ms){return (Math.floor(ms/100)/10).toFixed(1)+" sec."}
    function updateTimer(){const ms=elapsedMs();els.time.textContent=formatElapsed(ms);if(running&&!paused&&ms>=150000)failRound()}
    function startRound(){ensureAudio();pops=0;onePunches=0;misses=0;usedNumbers.clear();els.mistakeScreen.classList.remove("show");els.mistakeAnswer.textContent="";running=true;paused=false;elapsedBeforePause=0;startedAt=performance.now();els.overlay.classList.add("hidden");els.startBtn.textContent=TXT.again;nextPop();clearInterval(tickTimer);tickTimer=setInterval(updateTimer,100);updateHeader();updateTimer()}
    function finishRound(){const finalMs=elapsedMs();if(finalMs>=150000||misses>1){failRound();return}running=false;updateTimer();const finalTime=els.time.textContent;const now=new Date(),two=n=>String(n).padStart(2,"0");const playedAt=`&#26085;&#26178;  ${now.getFullYear()}/${two(now.getMonth()+1)}/${two(now.getDate())} ${two(now.getHours())}:${two(now.getMinutes())}:${two(now.getSeconds())}`;const confetti=Array.from({length:22},(_,i)=>`<i style="--x:${(i*37+8)%100}%;--r:${(i*47)%180}deg;--d:${(i%7)*.08}s;--c:${["#f6b73c","#ff6f61","#7446a8"][i%3]}"></i>`).join("");const hanamaru=Array.from({length:8},(_,i)=>`<i style="--a:${i*45}deg"></i>`).join("");clearTimeout(revealTimer);clearInterval(tickTimer);els.overlay.innerHTML=`<div class="card clear-card"><div class="confetti" aria-hidden="true">${confetti}</div><div class="hanamaru" aria-label="hanamaru">${hanamaru}</div><div class="clear-kicker">PRIME POP</div><h1 class="clear-title">\u30af\u30ea\u30a2</h1><div class="goal-badge">GOAL ${pops}</div><p class="clear-message">500\u5186\u21048</p><div class="card-grid"><div class="result-num"><small>TIME</small><strong>${finalTime}</strong></div><div class="result-num"><small>${TXT.opened}</small><strong>${pops}</strong></div><div class="result-num"><small>${TXT.miss}</small><strong>${misses}/1</strong></div></div><p class="clear-date">${playedAt}</p><button class="run-btn" id="againBtn">${TXT.again}</button></div>`;els.overlay.classList.remove("hidden");document.getElementById("againBtn").addEventListener("click",startRound)}
    function failRound(){if(!running)return;const finalTime=formatElapsed(elapsedMs());els.time.textContent=finalTime;running=false;clearTimeout(revealTimer);clearInterval(tickTimer);els.mistakeScreen.classList.remove("show");const now=new Date(),two=n=>String(n).padStart(2,"0");const playedAt=`&#26085;&#26178;  ${now.getFullYear()}/${two(now.getMonth()+1)}/${two(now.getDate())} ${two(now.getHours())}:${two(now.getMinutes())}:${two(now.getSeconds())}`;els.overlay.innerHTML=`<div class="card clear-card"><div class="clear-kicker">PRIME POP</div><h1 class="clear-title fail-title">\u30c1\u30e3\u30ec\u30f3\u30b8\u5931\u6557</h1><div class="goal-badge">GOAL ${targetCount()}</div><p class="clear-message">\u3082\u3046\u3044\u3061\u3069</p><div class="card-grid"><div class="result-num"><small>TIME</small><strong>${finalTime}</strong></div><div class="result-num"><small>${TXT.opened}</small><strong>${pops}</strong></div><div class="result-num"><small>${TXT.miss}</small><strong>${misses}/1</strong></div></div><p class="clear-date">${playedAt}</p><button class="run-btn" id="againBtn">${TXT.again}</button></div>`;els.overlay.classList.remove("hidden");document.getElementById("againBtn").addEventListener("click",startRound)}
    function togglePause(){if(!running)return;if(paused){paused=false;startedAt=performance.now();els.pauseBtn.textContent="II"}else{elapsedBeforePause=elapsedMs();paused=true;els.pauseBtn.textContent="\u25b6"}updateTimer()}
    function updateHeader(){const target=targetCount();els.popLabel.textContent=String(pops).padStart(2,"0")+" pops";els.missLabel.textContent="MISS "+misses+"/1";els.progress.textContent=String(Math.min(pops,target)).padStart(2,"0")+"/"+target}
    function nextPop(){clearTimeout(revealTimer);if(!bank.length)bank=buildBank(MODES[modeName]);const picked=weightedPick(candidatesForNextPop());usedNumbers.add(picked.n);original=picked.n;remaining=picked.n;currentFactors=picked.factors;inputChain=[];els.number.textContent=original;renderChain();els.gate.classList.remove("break","hit","wrong");void els.gate.offsetWidth}
    function renderChain(){if(!inputChain.length){els.chain.textContent="prime chips";els.chain.classList.add("empty")}else{els.chain.textContent=inputChain.join("\u00d7");els.chain.classList.remove("empty")}}
    function scheduleReveal(){clearTimeout(revealTimer);revealTimer=setTimeout(()=>{if(!running||paused||remaining===1)return;els.number.textContent=remaining},DISPLAY_DELAY)}
    function animateClass(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
    function shoot(prime){els.chip.textContent=prime;els.chip.classList.remove("fly");void els.chip.offsetWidth;els.chip.classList.add("fly")}
    function flash(button,c){button.classList.add(c);setTimeout(()=>button.classList.remove(c),180)}
    function endQuestionAfterMistake(){updateHeader();els.mistakeAnswer.textContent=currentFactors.join("\u00d7");els.mistakeScreen.classList.add("show");setTimeout(()=>{els.mistakeScreen.classList.remove("show");if(!running)return;misses>1?failRound():nextPop()},950)}
    function pressPrime(prime,button){if(!running||paused)return;ensureAudio();const shown=Number(els.number.textContent);const looksWrong=Number.isFinite(shown)&&shown!==remaining&&shown%prime!==0;if(looksWrong||remaining%prime!==0){clearTimeout(revealTimer);misses++;sound("bad");flash(button,"flash-bad");animateClass(els.gate,"wrong");endQuestionAfterMistake();return}clearTimeout(revealTimer);remaining/=prime;inputChain.push(prime);sound("good");shoot(prime);flash(button,"flash-good");renderChain();animateClass(els.gate,"hit");if(remaining===1){pops++;onePunches++;updateHeader();sound("pop");animateClass(els.spark,"show");animateClass(els.gate,"break");setTimeout(()=>{pops>=targetCount()?finishRound():nextPop()},430)}else scheduleReveal()}
    els.startBtn.addEventListener("click",startRound);els.homeStartBtn.addEventListener("click",startRound);els.pauseBtn.addEventListener("click",togglePause);document.querySelectorAll("[data-home-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.homeMode)));setMode("normal");updateTimer();
  </script>
