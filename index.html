<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prime Pop</title>
  <style>
    :root{--ink:#202124;--paper:#fbf7ee;--mint:#2bb7a8;--coral:#ff6f61;--sun:#f6b73c;--plum:#7446a8;--sky:#3d8eea;--shadow:rgba(49,35,14,.22);font-family:"Arial Rounded MT Bold","Yu Gothic",system-ui,sans-serif}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 18% 18%,rgba(61,142,234,.16) 0 16%,transparent 17%),linear-gradient(135deg,transparent 0 46%,rgba(255,111,97,.14) 46.2% 55%,transparent 55.2%),linear-gradient(26deg,#fbf7ee 0 62%,#eee6d8 62.2%);overflow:hidden;user-select:none}button{border:0;color:inherit;font:inherit;cursor:pointer;touch-action:manipulation}
    .app{width:min(100vw,520px);height:100svh;min-height:620px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;position:relative}.topbar{padding:14px 16px 5px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px}.stat{display:grid;gap:2px;font-weight:950;line-height:1}.stat small{font-size:13px;letter-spacing:.08em}.stat strong{font-size:32px}.progress{text-align:center;font-size:38px;font-weight:950;letter-spacing:.06em;line-height:1}.pause{justify-self:end;width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:rgba(255,255,255,.55);font-size:20px;font-weight:950;display:grid;place-items:center}
    .stage{position:relative;display:grid;align-items:center;padding:0 18px 8px;perspective:900px}.arena{width:92%;height:min(50svh,460px);min-height:330px;margin:0 auto;position:relative;display:grid;place-items:center}.gate{width:76%;max-width:350px;height:82%;position:relative;display:grid;place-items:center;color:white;background:linear-gradient(100deg,rgba(255,255,255,.20),transparent 22%),linear-gradient(155deg,#2f245f 0 44%,#16142e 44.5% 100%);border:6px solid #171326;border-radius:22px 22px 11px 11px;box-shadow:18px 18px 0 #20193a,0 26px 0 rgba(49,35,14,.16);transform:rotateY(-10deg) rotateZ(-3deg);transition:filter .16s ease;overflow:hidden}.gate:before{content:"";position:absolute;inset:12px;border-radius:16px 16px 8px 8px;border:3px dashed rgba(255,255,255,.2)}.gate:after{content:"";position:absolute;left:-22%;top:-15%;width:45%;height:150%;background:rgba(255,255,255,.11);transform:rotate(12deg)}.number{position:relative;z-index:2;font-size:clamp(78px,28vw,168px);font-weight:950;line-height:1;text-shadow:0 5px 0 rgba(0,0,0,.18)}
    .gate.hit{animation:hit .21s ease}.gate.wrong{animation:wrong .23s ease}.gate.break{animation:burst .5s ease forwards}.chip{position:absolute;left:4%;bottom:28%;width:48px;height:48px;border-radius:50%;color:white;background:var(--sky);display:grid;place-items:center;font-size:24px;font-weight:950;opacity:0;box-shadow:0 6px 0 #2063a5;pointer-events:none;z-index:3}.chip.fly{animation:fly .27s ease-out}.spark{position:absolute;inset:20% 12%;pointer-events:none;opacity:0;background:radial-gradient(circle at 42% 42%,white 0 3px,transparent 4px),radial-gradient(circle at 64% 38%,#ffe28a 0 4px,transparent 5px),radial-gradient(circle at 55% 62%,white 0 3px,transparent 4px),linear-gradient(110deg,transparent 0 45%,white 45.5% 46.5%,transparent 47%);mix-blend-mode:screen}.spark.show{animation:spark .43s ease}
    .chain{position:absolute;left:0;right:0;bottom:0;min-height:54px;padding:8px 16px;color:white;background:rgba(32,33,36,.72);display:grid;place-items:center;font-size:28px;font-weight:950;letter-spacing:.02em}.chain.empty{color:rgba(255,255,255,.68);font-size:18px}.controls{padding:0 12px 14px;display:grid;gap:10px}.prime-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.prime-btn{aspect-ratio:1;min-width:0;border-radius:18px;color:white;background:var(--mint);box-shadow:0 7px 0 #168578,0 12px 18px var(--shadow);font-size:clamp(31px,10vw,50px);font-weight:950;transition:transform .08s ease,filter .12s ease,background .12s ease}.prime-btn:nth-child(2n){background:var(--sky);box-shadow:0 7px 0 #2165aa,0 12px 18px var(--shadow)}.prime-btn:nth-child(3n){background:var(--sun);box-shadow:0 7px 0 #b97910,0 12px 18px var(--shadow)}.prime-btn:nth-child(4n){background:var(--coral);box-shadow:0 7px 0 #ba4238,0 12px 18px var(--shadow)}.prime-btn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.22)}.prime-btn.flash-good{filter:brightness(1.35)}.prime-btn.flash-bad{background:#3b3b3b;box-shadow:0 7px 0 #151515,0 12px 18px var(--shadow)}
    .mode-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode-btn,.run-btn{min-height:46px;border-radius:8px;background:#e5dccd;font-size:16px;font-weight:950;box-shadow:inset 0 -2px 0 rgba(0,0,0,.09)}.mode-btn.active{color:white;background:var(--plum)}.run-btn{color:white;background:var(--ink)}.overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:rgba(251,247,238,.94)}.card{width:min(100%,420px);border-radius:8px;background:white;padding:20px;display:grid;gap:14px;box-shadow:0 18px 50px rgba(49,35,14,.24)}.card h1{margin:0;font-size:34px;line-height:1}.card p{margin:0;line-height:1.7;font-weight:800}.card-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.result-num{padding:12px 8px;border-radius:8px;background:#f1eadf;text-align:center;display:grid;gap:4px}.result-num small{font-size:12px;font-weight:900;color:#665d50}.result-num strong{font-size:31px;line-height:1}.hidden{display:none}
    @keyframes hit{0%{transform:rotateY(-10deg) rotateZ(-3deg) translateX(0)}50%{transform:rotateY(-10deg) rotateZ(-3deg) translateX(9px) scale(.99);filter:brightness(1.25)}100%{transform:rotateY(-10deg) rotateZ(-3deg) translateX(0)}}@keyframes wrong{0%,100%{transform:rotateY(-10deg) rotateZ(-3deg) translateX(0)}25%{transform:rotateY(-10deg) rotateZ(-3deg) translateX(-9px)}75%{transform:rotateY(-10deg) rotateZ(-3deg) translateX(9px)}}@keyframes burst{0%{transform:rotateY(-10deg) rotateZ(-3deg) scale(1);opacity:1}62%{transform:rotateY(-10deg) rotateZ(-3deg) scale(1.1);opacity:.32}100%{transform:rotateY(-10deg) rotateZ(-3deg) scale(.84);opacity:0}}@keyframes fly{0%{transform:translate(0,0) scale(.65) rotate(-18deg);opacity:0}20%{opacity:1}100%{transform:translate(230px,-132px) scale(.42) rotate(28deg);opacity:0}}@keyframes spark{0%{opacity:0;transform:scale(.75)}35%{opacity:1}100%{opacity:0;transform:scale(1.18)}}@media(max-height:720px){.topbar{padding-top:8px}.arena{height:44svh;min-height:280px}.prime-pad{gap:7px}.controls{gap:7px;padding-bottom:8px}.chain{min-height:46px;font-size:24px}}
  </style>
</head>
<body>
  <main class="app" aria-label="Prime Pop">
    <section class="topbar"><div class="stat"><small>TIME</small><strong id="time">120.0</strong><small id="popLabel">00 pops</small></div><div class="progress" id="progress">00/20</div><button class="pause" id="pauseBtn" aria-label="pause">II</button></section>
    <section class="stage"><div class="arena"><div class="chip" id="chip">2</div><div class="gate" id="gate"><div class="number" id="number">56</div></div><div class="spark" id="spark"></div></div><div class="chain empty" id="chain">prime chips</div></section>
    <section class="controls"><div class="prime-pad" id="pad"></div><div class="mode-row"><button class="mode-btn active" id="normalBtn">&#12405;&#12388;&#12358; 200&#12414;&#12391;</button><button class="mode-btn" id="challengeBtn">&#12481;&#12515;&#12524;&#12531;&#12472; 999&#12414;&#12391;</button></div><button class="run-btn" id="startBtn">2&#20998; START</button></section>
    <section class="overlay" id="overlay"><div class="card"><h1>Prime Pop</h1><p>&#25968;&#23383;&#12434;&#32032;&#25968;&#12481;&#12483;&#12503;&#12391;&#12431;&#12387;&#12390;&#12466;&#12540;&#12488;&#12434;&#38283;&#12369;&#12424;&#12358;&#12290;&#27490;&#12414;&#12427;&#12392;1.5&#31186;&#24460;&#12395;&#12289;&#27531;&#12426;&#12398;&#25968;&#12384;&#12369;&#35211;&#12360;&#12414;&#12377;&#12290;</p><div class="mode-row"><button class="mode-btn active" data-start-mode="normal">&#12405;&#12388;&#12358;</button><button class="mode-btn" data-start-mode="challenge">&#12481;&#12515;&#12524;&#12531;&#12472;</button></div><button class="run-btn" id="overlayStart">START</button></div></section>
  </main>
  <script>
    const TXT={normal:"\u3075\u3064\u3046",challenge:"\u30c1\u30e3\u30ec\u30f3\u30b8",again:"\u3082\u3046\u4e00\u56de",done:"\u304a\u3057\u307e\u3044",opened:"\u3042\u3051\u305f",one:"\u30ef\u30f3\u30d1\u30f3",miss:"\u30df\u30b9",result:"\u6b21\u306f\u3061\u304c\u3046\u6570\u5b57\u304c\u51fa\u307e\u3059\u3002",divide:"\u3067\u308f\u308b"};
    const MODES={normal:{label:TXT.normal,primes:[2,3,5,7,11],max:200,filter:()=>true},challenge:{label:TXT.challenge,primes:[2,3,5,7,11,13,17,19],max:999,filter:f=>!f.some(n=>n>=13)||f.length<=3}};
    const ROUND_SECONDS=120,REVEAL_DELAY=1500,FAVORITES=[42,48,54,56,63,64,72,81,84,96,99,108,121,132,144,154,168,176,180,198];
    const TIMES_TABLE=[4,6,8,9,10,12,14,15,16,18,20,21,24,25,27,28,30,32,35,36,40,42,45,48,49,54,56,63,64,72,81];
    const els={time:document.getElementById("time"),popLabel:document.getElementById("popLabel"),progress:document.getElementById("progress"),pad:document.getElementById("pad"),gate:document.getElementById("gate"),number:document.getElementById("number"),chain:document.getElementById("chain"),chip:document.getElementById("chip"),spark:document.getElementById("spark"),normalBtn:document.getElementById("normalBtn"),challengeBtn:document.getElementById("challengeBtn"),startBtn:document.getElementById("startBtn"),overlayStart:document.getElementById("overlayStart"),overlay:document.getElementById("overlay"),pauseBtn:document.getElementById("pauseBtn")};
    let modeName="normal",bank=[],remaining=1,original=1,inputChain=[],shownIntermediate=false,pops=0,onePunches=0,misses=0,running=false,paused=false,endsAt=0,pausedLeft=ROUND_SECONDS*1000,tickTimer=null,revealTimer=null,audioContext=null;
    function factorsOf(value,primes){const factors=[];let n=value;for(const p of primes){while(n%p===0){factors.push(p);n/=p}}return n===1?factors:null}
    function buildBank(mode){const items=[];for(let n=2;n<=mode.max;n++){const factors=factorsOf(n,mode.primes);if(factors&&factors.length>1&&mode.filter(factors))items.push({n,factors})}return items}
    function weightOf(item){return(FAVORITES.includes(item.n)?4:1)+Math.min(item.factors.length,5)*.4}
    function weightedPick(items){let needle=Math.random()*items.reduce((s,i)=>s+weightOf(i),0);for(const item of items){needle-=weightOf(item);if(needle<=0)return item}return items[items.length-1]}
    function targetCount(){return modeName==="normal"?30:20}
    function candidatesForNextPop(){const q=pops+1,firstHalf=q<=Math.ceil(targetCount()/2),allowEleven=q>=8;let items=bank.filter(item=>{if(!allowEleven&&item.factors.includes(11))return false;if(modeName==="normal"&&q<=15)return TIMES_TABLE.includes(item.n);if(firstHalf)return item.n>=10&&item.n<=99;return item.n>=100});if(!items.length)items=bank.filter(item=>allowEleven||!item.factors.includes(11));return items.length?items:bank}
    function ensureAudio(){if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==="suspended")audioContext.resume()}
    function tone(freq,duration,type,gainValue){ensureAudio();const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(gainValue,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);osc.connect(gain);gain.connect(audioContext.destination);osc.start();osc.stop(audioContext.currentTime+duration)}
    function sound(kind){if(kind==="good")tone(560,.075,"sine",.08);if(kind==="bad")tone(112,.13,"square",.065);if(kind==="pop"){tone(260,.08,"triangle",.08);setTimeout(()=>tone(720,.12,"sine",.08),70)}}
    function setMode(nextMode){modeName=nextMode;bank=buildBank(MODES[modeName]);els.normalBtn.classList.toggle("active",modeName==="normal");els.challengeBtn.classList.toggle("active",modeName==="challenge");document.querySelectorAll("[data-start-mode]").forEach(b=>b.classList.toggle("active",b.dataset.startMode===modeName));renderPad();nextPop()}
    function renderPad(){els.pad.innerHTML="";MODES[modeName].primes.forEach(prime=>{const button=document.createElement("button");button.className="prime-btn";button.textContent=prime;button.setAttribute("aria-label",`${prime}${TXT.divide}`);button.addEventListener("click",()=>pressPrime(prime,button));els.pad.appendChild(button)})}
    function updateTimer(){const left=running&&!paused?Math.max(0,endsAt-performance.now()):pausedLeft;els.time.textContent=(left/1000).toFixed(1);if(running&&left<=0)finishRound()}
    function startRound(){ensureAudio();pops=0;onePunches=0;misses=0;running=true;paused=false;pausedLeft=ROUND_SECONDS*1000;endsAt=performance.now()+pausedLeft;els.overlay.classList.add("hidden");els.startBtn.textContent=TXT.again;nextPop();clearInterval(tickTimer);tickTimer=setInterval(updateTimer,100);updateHeader();updateTimer()}
    function finishRound(){running=false;clearTimeout(revealTimer);clearInterval(tickTimer);els.overlay.innerHTML=`<div class="card"><h1>${TXT.done}</h1><div class="card-grid"><div class="result-num"><small>${TXT.opened}</small><strong>${pops}</strong></div><div class="result-num"><small>${TXT.one}</small><strong>${onePunches}</strong></div><div class="result-num"><small>${TXT.miss}</small><strong>${misses}</strong></div></div><p>${MODES[modeName].label}${TXT.result}</p><button class="run-btn" id="againBtn">${TXT.again}</button></div>`;els.overlay.classList.remove("hidden");document.getElementById("againBtn").addEventListener("click",startRound)}
    function togglePause(){if(!running)return;if(paused){paused=false;endsAt=performance.now()+pausedLeft;els.pauseBtn.textContent="II"}else{pausedLeft=Math.max(0,endsAt-performance.now());paused=true;els.pauseBtn.textContent="\u25b6"}updateTimer()}
    function updateHeader(){const target=targetCount();els.popLabel.textContent=String(pops).padStart(2,"0")+" pops";els.progress.textContent=String(Math.min(pops,target)).padStart(2,"0")+"/"+target}
    function nextPop(){clearTimeout(revealTimer);if(!bank.length)bank=buildBank(MODES[modeName]);const picked=weightedPick(candidatesForNextPop());original=picked.n;remaining=picked.n;inputChain=[];shownIntermediate=false;els.number.textContent=original;renderChain();els.gate.classList.remove("break","hit","wrong");void els.gate.offsetWidth}
    function renderChain(){if(!inputChain.length){els.chain.textContent="prime chips";els.chain.classList.add("empty")}else{els.chain.textContent=inputChain.join("\u00d7");els.chain.classList.remove("empty")}}
    function scheduleReveal(){clearTimeout(revealTimer);revealTimer=setTimeout(()=>{if(!running||paused||remaining===original||remaining===1)return;shownIntermediate=true;els.number.textContent=remaining},REVEAL_DELAY)}
    function animateClass(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
    function shoot(prime){els.chip.textContent=prime;els.chip.classList.remove("fly");void els.chip.offsetWidth;els.chip.classList.add("fly")}
    function flash(button,c){button.classList.add(c);setTimeout(()=>button.classList.remove(c),180)}
    function pressPrime(prime,button){if(!running||paused)return;ensureAudio();if(remaining%prime!==0){misses++;sound("bad");flash(button,"flash-bad");animateClass(els.gate,"wrong");updateHeader();return}clearTimeout(revealTimer);remaining/=prime;inputChain.push(prime);sound("good");shoot(prime);flash(button,"flash-good");renderChain();animateClass(els.gate,"hit");if(remaining===1){pops++;if(!shownIntermediate)onePunches++;updateHeader();sound("pop");animateClass(els.spark,"show");animateClass(els.gate,"break");setTimeout(nextPop,430)}else scheduleReveal()}
    els.normalBtn.addEventListener("click",()=>setMode("normal"));els.challengeBtn.addEventListener("click",()=>setMode("challenge"));els.startBtn.addEventListener("click",startRound);els.overlayStart.addEventListener("click",startRound);els.pauseBtn.addEventListener("click",togglePause);document.querySelectorAll("[data-start-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.startMode)));setMode("normal");updateTimer();
  </script>
</body>
</html>
